[package]
name = "url-shortener"
version = "0.1.0"
edition = "2024"

[features]
default = ["swagger"]
swagger = ["dep:utoipa", "dep:utoipa-swagger-ui"]

[dependencies]
axum = { version = "0.8.8", features = ["tokio"] }
blake3 = { version = "1.8.4" }
chrono = { version = "0.4.42", features = ["default"] }
metrics = { version = "0.24.1" }
metrics-exporter-prometheus = { version = "0.16.2" }
redis = { version = "0.27.6", features = ["tokio-comp", "connection-manager"] }
sea-orm-migration = { version = "~2.0.0-rc", features = ["runtime-tokio-native-tls", "sqlx-postgres"] }
sea-query = { version = "~1.0.0-rc", features = ["with-chrono"] }
sea-query-sqlx = { version = "~0.8.0-rc", features = ["sqlx-postgres", "with-chrono"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.139" }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "chrono"] }
thiserror = { version = "2.0.18" }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = { version = "0.9.7", features = ["serde"] }
tower-http = { version = "0.6.2", features = ["trace", "request-id", "cors"] }
tracing = { version = "0.1.41" }
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-perl"] }
url = { version = "2.5.8" }
utoipa = { version = "5.3.1", features = ["axum_extras", "chrono"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }

[dev-dependencies]
testcontainers = { version = "0.26.3" }
testcontainers-modules = { version = "0.14.0", features = ["postgres", "redis"] }
