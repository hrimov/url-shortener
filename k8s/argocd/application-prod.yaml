apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: url-shortener-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/hrimov/url-shortener-internal.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: url-shortener
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
